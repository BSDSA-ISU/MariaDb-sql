<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Password Entry</title>

    <!-- Your CSS -->
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <!-- NAVBAR -->
    <header class="navbar">
        <div class="nav-container">
            <div class="logo">
                🔐 Vault Editor
            </div>

            <nav>
                <a href="/">Home</a>
                <a href="/passwords">Passwords</a>
                <a href="/logout">Logout</a>
            </nav>
        </div>
    </header>

    <!-- MAIN -->
    <main class="container">

        <!-- HERO -->
        <section class="hero">
            <h1>Edit Password Entry</h1>
            <p>Update stored credentials safely.</p>
        </section>

        <!-- CARD -->
        <section class="card">

            <!-- FLASH MESSAGE -->
            {% if message %}
            <div class="instruction-box" style="margin-bottom: 20px;">
                {{ message }}
            </div>
            {% endif %}

            <!-- FORM -->
            <form method="POST" class="form">

                <!-- WEBSITE -->
                <div>
                    <label for="website">Website</label>
                    <input 
                        type="text"
                        id="website"
                        name="website"
                        placeholder="example.com"
                        value="{{ entry.website }}"
                    >
                </div>

                <!-- USERNAME -->
                <div>
                    <label for="username">Username / Email</label>
                    <input 
                        type="text"
                        id="username"
                        name="username"
                        placeholder="username"
                        value="{{ entry.username }}"
                    >
                </div>

                <!-- PASSWORD -->
                <div>
                    <label for="password">Password</label>
                    <input 
                        type="password"
                        id="password"
                        name="password"
                        placeholder="password"
                        value="{{ entry.password }}"
                    >
                </div>

                <!-- COMMENT -->
                <div>
                    <label for="comment">Comment</label>
                    <textarea 
                        id="comment"
                        name="comment"
                        rows="5"
                        placeholder="Optional notes..."
                    >{{ entry.comment }}</textarea>
                </div>

                <!-- BUTTONS -->
                <div style="display:flex; gap:10px; margin-top:10px;">

                    <button type="submit">
                        Save Changes
                    </button>

                    <a href="/passwords" class="project-btn secondary">
                        Cancel
                    </a>

                </div>

            </form>
        </section>

    </main>

    <!-- FOOTER -->
    <footer class="footer-bottom">
        <p>
            Koishi Vault • Flask Password Manager
        </p>
    </footer>

</body>
</html>
